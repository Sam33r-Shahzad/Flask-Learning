

{% extends 'base.html' %}

{% block content %}
    {% if current_user.is_authenticated %}
        <h3>Hello, {{ current_user.username }}!</h3>
        <a href="{{ url_for('logout') }}">Logout</a> | 
    {% else %}
        <h3>Hello, Guest!</h3>
        <a href="{{ url_for('login') }}">Login</a> | 
        <a href="{{ url_for('signup') }}">Sign Up</a> | 
    {% endif %}
    
    <a href="{{ url_for('secret') }}">Protected Secret Page</a>
{% endblock %}
