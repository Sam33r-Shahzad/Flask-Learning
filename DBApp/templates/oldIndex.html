{% extends 'base.html' %}

{% block title %}Index{% endblock %}

{% block content %}
    <h1>Index Page</h1>

    <ul>
        {% for person in people %}
            <li>
                {{ person }}
                <!-- Details Link -->
                <a href="{{ url_for('details', p_id=person.p_id) }}">Details</a>
                
                <!-- Delete Button -->
                <button onclick="deletePerson({{ person.p_id }})">Delete</button>
            </li>
        {% endfor %}
    </ul>

    <hr>
    <h3>New Person</h3>
    <form action="{{ url_for('index') }}" method="POST">
        <input type="text" name="name" placeholder="Name" required><br><br>
        <input type="number" name="age" placeholder="Age"><br><br>
        <input type="text" name="job" placeholder="Job"><br><br>
        <input type="submit" value="Create">
    </form>

    <script type="text/javascript">
        function deletePerson(p_id) {
            fetch("{{ url_for('delete', p_id=0) }}".replace('0', p_id), {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    console.error("Failed to delete item with PID: " + p_id);
                }
            })
            .catch(error => console.error("Error during fetching:", error));
        }
    </script>
{% endblock %}
